name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    # Every push is verified once. A pull request from this repository already has that push run,
    # so its duplicate run is skipped; pull requests from forks still run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: torchline
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: torchline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U torchline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://torchline:isolated-ci-password@127.0.0.1:5432/torchline
      WORLD_MODE: simulation
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
      PG_TOOL_CONTAINER: postgres:17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.2
      - name: Record toolchain versions
        run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:version
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:browser
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: .local/browser-results
          retention-days: 7
      - run: pnpm audit:balance && pnpm design:fixtures && pnpm readme:proof
      - run: pnpm check:repo
      - run: git diff --exit-code -- docs/reports docs/design/fixtures assets/readme/proof.json assets/readme/flight-log.csv
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} -t torchline:check .
      - run: node scripts/smoke-container.mjs torchline:check
      - name: One-command preview (docker compose)
        run: docker compose up --build --wait --wait-timeout 240 && node scripts/smoke-compose.mjs
      - name: Stop the preview
        if: always()
        run: docker compose down --volumes
      - name: Hosted demo image (production mode, private loopback PostgreSQL)
        run: |
          docker build -f deploy/demo/Dockerfile -t torchline:demo .
          docker run -d --name torchline-demo -p 127.0.0.1:3100:3000 \
            -e PUBLIC_BASE_URL=https://demo.invalid torchline:demo
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3100/health/ready >/dev/null && break
            sleep 2
          done
          PREVIEW_URL=http://127.0.0.1:3100 PREVIEW_ORIGIN=https://demo.invalid node scripts/smoke-compose.mjs
      - name: Hosted demo logs
        if: always()
        run: docker logs torchline-demo 2>&1 | tail -40 || true
      - name: Judges' own live setup (live mode, their Twitch app and ngrok address)
        run: node scripts/smoke-live-compose.mjs
      - name: Stop the live setup
        if: always()
        run: |
          docker compose --env-file .env.live -f compose.live.yaml logs app 2>&1 | tail -40 || true
          docker compose --env-file .env.live -f compose.live.yaml down --volumes || true
