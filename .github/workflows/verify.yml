name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    # Every push is verified once. A pull request from this repository already has that push run,
    # so its duplicate run is skipped; pull requests from forks still run here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: torchline
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: torchline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U torchline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://torchline:isolated-ci-password@127.0.0.1:5432/torchline
      WORLD_MODE: simulation
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
      PG_TOOL_CONTAINER: postgres:17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.2
      - name: Record toolchain versions
        run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:version
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:browser
      - run: pnpm audit:balance && pnpm design:fixtures && pnpm readme:proof
      - run: pnpm check:repo
      - run: git diff --exit-code -- docs/reports docs/design/fixtures assets/readme/proof.json assets/readme/flight-log.csv
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} -t torchline:check .
      - run: node scripts/smoke-container.mjs torchline:check
